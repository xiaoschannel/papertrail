name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      # The orientation model the tests run is fetched on first use (orientation.py); keep it between runs
      # rather than downloading it from PyPI every time. The key ends in the start of its pinned hash
      # (orientation.MODEL_SHA256): change it with the model, or every run downloads the new one.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/papertrail
          key: orientation-model-2f62c9bfb830
      - name: Run tests
        run: python -m pytest -q
      # The committed fixtures are generated: they must be exactly what the generator makes.
      - name: Test fixtures match their generator
        run: |
          python tools/build_fixture.py
          if [ -n "$(git status --porcelain --untracked-files=all -- tests/fixtures)" ]; then
            git status --short -- tests/fixtures
            echo "::error::tests/fixtures differ from tools/build_fixture.py: regenerate and commit them"
            exit 1
          fi

  # The app runs on Windows, and its live tooling only exists there (a scheduled task, taskkill, pythonw):
  # the ubuntu job skips those tests, so this is where they run.
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      # The orientation model the tests run is fetched on first use (orientation.py); keep it between runs
      # rather than downloading it from PyPI every time. The key ends in the start of its pinned hash
      # (orientation.MODEL_SHA256): change it with the model, or every run downloads the new one.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/papertrail
          key: orientation-model-2f62c9bfb830
      - name: Run tests
        run: python -m pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # The API types are generated from the backend itself before the build (prebuild ->
      # gen:api), so the frontend is always checked against the API as it is: it needs Python too.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the backend's dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate the API types, type-check and build
        run: npm run build
